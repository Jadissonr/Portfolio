name: Atualizar progresso do TryHackMe

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar progresso e atualizar arquivo
        env:
          THM_USERNAME: ${{ secrets.THM_USER_HASH }}
        run: python fetch_progress.py

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ctf-writeups/tryhackme/progresso-geral.md
          git diff --cached --quiet && echo "Nada novo para commitar." && exit 0
          git commit -m "docs: atualiza progresso do TryHackMe [automatico]"
          git push
